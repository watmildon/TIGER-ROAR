name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # gradle-josm-plugin reads git tags to compute Plugin-Version

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Inspect manifest
        run: unzip -p build/dist/TIGER-ROAR.jar META-INF/MANIFEST.MF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/dist/TIGER-ROAR.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
